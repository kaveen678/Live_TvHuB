<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Premium Glass Player - Admin Pro</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00d2ff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://i.ibb.co/fYNjcnvq/penguins-of-madagascar-movie.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(2px); 
            z-index: -1;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            width: 95%;
            max-width: 900px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            margin-top: -60px;
            z-index: 1;
        }

        .plyr { border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
        /* ප්‍රෝග්‍රස් බාර් එක අවශ්‍ය නම් පහත පේළිය මකා දමන්න */
        .plyr__progress, .plyr__time--current, .plyr__time--duration { display: none !important; }

        #adminPanel {
            display: none;
            margin-top: 15px;
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            text-align: left;
        }

        .admin-info {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            word-wrap: break-word;
            word-break: break-all;
            white-space: normal;
            line-height: 1.4;
            color: #e0e0e0;
        }

        input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 8px;
            color: white;
            width: calc(100% - 26px);
            margin-bottom: 15px;
            outline: none;
            font-size: 14px;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            margin-bottom: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .admin-trigger {
            position: fixed;
            bottom: 110px;
            right: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 100;
            border: 1px solid var(--glass-border);
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            text-align: center;
            z-index: 90;
        }

        .copyright { font-size: 12px; margin-bottom: 25px; }
        .designer { font-size: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="glass-container">
    <video id="player" playsinline controls crossorigin="anonymous"></video>

    <div id="adminPanel">
        <div class="admin-info">
            <strong style="color: var(--accent);">Current Active Link:</strong><br>
            <span id="currentLinkDisp">Loading...</span><br><br>
            <strong>Last Updated:</strong> <span id="lastUpdatedDisp" style="color: #00ffaa;">Never</span>
        </div>
        
        <label style="font-size: 13px; margin-bottom: 8px; display: block;">New Stream URL:</label>
        <input type="text" id="m3u8Url" placeholder="Paste your .m3u8 link here">
        <br>
        <button onclick="updateStream()">Update & Save</button>
        <button class="btn-close" onclick="closeAdmin()">Close Admin Panel</button>
    </div>
</div>

<div class="admin-trigger" onclick="checkAccess()">ADMIN LOGIN</div>

<footer>
    <div class="copyright">©2026 All Right Received</div>
    <div class="designer">Design & Powered By Kaveen Chamodya</div>
</footer>

<script>
    const video = document.getElementById('player');
    
    // නව ලින්ක් එක මෙහි ඇතුළත් කර ඇත
    let defaultUrl = 'https://live-en.aisports.cc/moviebox/device01/playlist.m3u8';
    
    // LocalStorage පරීක්ෂා කර ප්ලේයරය ක්‍රියාත්මක කිරීම
    let savedSource = localStorage.getItem('stream_url') || defaultUrl;
    let lastUpdated = localStorage.getItem('last_update_time') || 'N/A';

    document.getElementById('currentLinkDisp').innerText = savedSource;
    document.getElementById('lastUpdatedDisp').innerText = lastUpdated;

    document.addEventListener('DOMContentLoaded', () => {
        const defaultOptions = {
            controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            settings: ['quality', 'speed']
        };

        if (Hls.isSupported()) {
            const hls = new Hls({
                xhrSetup: function(xhr, url) {
                    xhr.withCredentials = false;
                }
            });
            hls.loadSource(savedSource);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const availableQualities = hls.levels.map((l) => l.height);
                availableQualities.unshift(0); 
                defaultOptions.quality = {
                    default: 0,
                    options: availableQualities,
                    forced: true,
                    onChange: (e) => {
                        if (e === 0) window.hls.currentLevel = -1;
                        else window.hls.levels.forEach((l, i) => { if (l.height === e) window.hls.currentLevel = i; });
                    },
                };
                new Plyr(video, defaultOptions);
            });
            window.hls = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = savedSource;
            new Plyr(video, defaultOptions);
        }
    });

    function checkAccess() {
        if (prompt("Enter Security Code:") === "544544") {
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alert("Access Denied!");
        }
    }

    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('m3u8Url').value = ''; 
    }

    function updateStream() {
        let newUrl = document.getElementById('m3u8Url').value;
        if (newUrl) {
            let now = new Date().toLocaleString();
            localStorage.setItem('stream_url', newUrl);
            localStorage.setItem('last_update_time', now);
            alert("Stream Updated Successfully!");
            window.location.reload();
        } else {
            alert("Please paste a link first.");
        }
    }
</script>
</body>
</html>
